[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ewma-sma30"
version = "0.1.0"
description = "Live (not frozen) SPY cash/invested signal: EWMA signed covariance, SMA30, lambda 0.94, 5-day percentile drop -0.70. Does not trade."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ewma-sma30 = "ewma_sma30.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
