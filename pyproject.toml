[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-z125-sma30"
version = "1.0.0"
description = "Frozen SPY cash/invested rule: four-asset correlation speed Z>1.25 plus SPY 30-day SMA gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
spy-z125-sma30 = "spy_z125_sma30.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
spy_z125_sma30 = ["fixtures/*.csv"]
